plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.prototypejust.weworkshop'
    compileSdk 35

    defaultConfig {
        applicationId "com.prototypejust.weworkshop"
        minSdk 26
        targetSdk 35
        versionCode 25
        versionName "0.6.0"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources.excludes += '/META-INF/{AL2.0,LGPL2.1}'
        resources.excludes += '/META-INF/versions/9/OSGI-INF/MANIFEST.MF'
    }
}

dependencies {
    implementation 'in.dragonbra:javasteam:1.8.0'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'com.google.protobuf:protobuf-java:4.31.1'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'com.github.luben:zstd-jni:1.5.7-4@aar'
    implementation 'org.tukaani:xz:1.10'
    implementation 'org.lz4:lz4-java:1.8.0'

    // 原生播放内核。原画走解码器 -> SurfaceView 直出，不经过 WebView。
    // 1.8.1 的 minCompileSdk 正好是 35，与项目一致；
    // setScrubbingModeEnabled 自 1.8 才进入 ExoPlayer 接口（1.7 及以下没有），
    // 拖动跟手依赖它，所以不能降到 1.6/1.7。1.11 起要求 compileSdk 36，暂不采用。
    implementation 'androidx.media3:media3-exoplayer:1.8.1'
    implementation 'androidx.media3:media3-ui:1.8.1'
}
